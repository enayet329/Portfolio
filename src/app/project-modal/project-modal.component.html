<div class="modal-header project-modal-header">
  <div>
    <h2 class="project-modal-title">{{ project.name }}</h2>
    <p class="project-modal-tagline">{{ project.tagline }} · <span class="mono">{{ project.duration }}</span></p>
  </div>
  <button type="button" class="btn-close" aria-label="Close" (click)="bsModalRef.hide()"></button>
</div>

<div class="modal-body project-modal-body">
  <div class="project-modal-status" *ngIf="project.statusLabel">
    <span class="status-dot" [class.is-completed]="project.status === 'completed'"></span>
    <span>{{ project.statusLabel }}</span>
  </div>

  <section class="project-modal-section">
    <h3>About the project</h3>
    <p>{{ project.description }}</p>
  </section>

  <section class="project-modal-section">
    <h3>Highlights</h3>
    <ul>
      <li *ngFor="let h of project.highlights">{{ h }}</li>
    </ul>
  </section>

  <section class="project-modal-section">
    <h3>Tech stack</h3>
    <div class="project-modal-tags">
      <span *ngFor="let tag of project.tags"
            class="project-tag"
            [style.color]="tag.color"
            [style.border-color]="tag.color + '55'">{{ tag }}</span>
    </div>
  </section>

  <footer class="project-modal-links">
    <a *ngIf="project.projectLink" [href]="project.projectLink" target="_blank" rel="noopener"
       class="btn-secondary-cta">View on GitHub →</a>
    <a *ngIf="project.liveLink" [href]="project.liveLink" target="_blank" rel="noopener"
       class="btn-primary-cta">Visit live ↗</a>
  </footer>
</div>

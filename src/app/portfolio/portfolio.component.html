<section id="projects" class="section">
  <div class="container-wide">
    <div class="section-eyebrow">Featured Projects</div>
    <h2 class="section-title">Things I've <span class="gradient-text">shipped</span></h2>
    <p class="section-subtitle">
      A selection of production and reference projects spanning OTA travel
      platforms, distributed microservices, and high-volume analytics systems.
    </p>

    <div class="projects-grid" appReveal>
      <app-project-card *ngFor="let project of projects" [project]="project"></app-project-card>
    </div>
  </div>
</section>
